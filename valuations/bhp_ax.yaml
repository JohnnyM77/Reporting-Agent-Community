# Reported figures SWS does not cover, from BHP's own results releases.
# Same basis as SWS: BHP FY16 -120.0c, 1H16 -106.5c, 1H17 +60.2c give a
# Dec-2016 TTM of 46.7c, exactly SWS's 1H2017 TTM figure.
extra_eps:
  # FY10-FY13 only feed the 5-year smoothing window before the chart starts.
  # Dated at the ASX two-month deadline (31 Aug): late, never early.
  - {date: "2010-08-31", period: "FY2010", eps: 228.6, source: "BHP Billiton Form 20-F (SEC): basic EPS FY2010 228.6 US cents"}
  - {date: "2011-08-31", period: "FY2011", eps: 429.1, source: "BHP Billiton Form 20-F (SEC): basic EPS FY2011 429.1 US cents"}
  - {date: "2012-08-31", period: "FY2012", eps: 289.6, source: "BHP Billiton results for the year ended 30 June 2012 (SEC 6-K): basic EPS 289.6 US cents"}
  - {date: "2013-08-31", period: "FY2013", eps: 210.9, source: "BHP Billiton Form 20-F FY2014 (SEC): basic EPS FY2013 210.9 US cents"}
  - {date: "2014-08-19", period: "FY2014", eps: 260.0, source: "BHP Billiton results for the year ended 30 June 2014 (19 Aug 2014): basic EPS 260.0 US cents"}
  - {date: "2015-08-25", period: "FY2015", eps: 35.9, source: "BHP Billiton results for the year ended 30 June 2015 (25 Aug 2015): basic EPS 35.9 US cents"}
  - {date: "2016-08-16", period: "FY2016", eps: -120.0, source: "BHP Billiton results for the year ended 30 June 2016 (16 Aug 2016): basic loss per share 120.0 US cents"}
  - {date: "2026-08-18", period: "FY2026", eps: 193.6, source: "BHP results for the year ended 30 June 2026 (18 Aug 2026): basic EPS 193.6 US cents (FY25 177.8)"}

# BUY/SELL framework. Set by JM in Oct 2026 and applied to the whole history
# on purpose: it is a view of what BHP is worth on reported earnings, not a
# record of past decisions. The 9x/16x it replaces was an unreviewed starter
# config. Cross-check (Oct 2026): justified PE (1 - g/ROE)/(r - g) with
# r 8.6% (SWS cost of equity), g 2.5-3%, ROE ~20% gives ~14-15x; so 13x is a
# 10-15% margin under fair and 20x is ~35% over it.
multiple_history:
  - {date: "2014-08-14", buy_pe: 13, sell_pe: 20, reason: "JM's BHP framework (set Oct 2026), applied to the whole history"}

# Through-the-cycle EPS. A miner's reported EPS swings 5x between trough and
# peak, so the wedge is set on a smoothed figure: at each result, the average
# of the reported 12-month EPS figures released in the previous 5 years (no
# look-ahead). The statutory corridor stays on the chart, faint, for reference.
# FY16 (Samarco dam failure and impairments) is a one-off: left out of the
# average, still shown as a loss on the statutory line.
eps_smoothing:
  years: 5
  exclude: [FY2016]
  reason: "BHP is a cyclical; the BUY/SELL corridor uses a 5-year average of reported EPS, statutory shown faint behind it"

# Fair value sits 30% of the way from BUY to SELL (13x + 0.3 x 7 = 15.1x):
# JM buys well below value and sells well above it, not symmetrically.
fair_split: 0.3

# Periods deliberately left out, with the reason printed on the chart.
eps_exclude:
  - {period: "1H2016 TTM", reason: "SWS's Dec-2015 TTM (-114.9c) does not reconcile with BHP's reported FY15 / 1H15 / 1H16 figures around the South32 demerger, so it is not used"}

# ── What happened (printed next to the EPS move it explains) ─────────────────
period_notes:
  FY2015: "Commodity collapse; South32 demerged May 2015"
  FY2016: "Samarco dam failure and impairments: statutory loss"
  1H2017 TTM: "Back to profit as iron ore and coal recover"
  1H2022 TTM: "Iron ore boom"
  1H2023 TTM: "Peak earnings"
  1H2024 TTM: "Iron ore and coal prices off the peak"
  FY2026: "FY26 result: basic EPS 193.6c"
