  - {date: "2021-02-15", period: "1H2021 TTM", period_end: "2020-12-31", ttm_eps: 141.507, ttm_div: 156, currency: "USD", source: "SWS export ASX_BHP.csv", notes: "Reported trailing-12-month EPS (SWS); release date = SWS dividend date (on or just after the results)"}
