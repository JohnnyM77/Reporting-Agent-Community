# ──────────────────────────────────────────────────────────────────────────────
# LAU.AX — Lindsay Australia Limited  |  Value wedge config
# Refrigerated road + rail freight (farm to port) and rural merchandise.
# Held Jan 2024 - May 2026 (two buys, one exit: data/decisions.json, theses/LAU.md).
# ──────────────────────────────────────────────────────────────────────────────

ticker: LAU.AX
company_name: Lindsay Australia Limited
business: "Refrigerated road and rail freight, rural merchandise (horticulture-weighted)"
exchange: ASX
stock_type: value

# BUY 10x / SELL 18x, fair ~12.4x (30% of the way up). Set Oct 2026 for this
# chart, applied to the whole history: the thesis bought at ~10x, "roughly 50%
# below its own decade average multiple excluding the COVID years" (~20x). SELL
# sits below that average because the exit concluded the cheapness was a
# correct read of low-margin economics, not a mispricing. Change freely.
buy_multiple: 10
sell_multiple: 18
multiple_history:
  - {date: "2016-08-29", buy_pe: 10, sell_pe: 18, reason: "LAU framework (set Oct 2026), applied to the whole history"}
fair_split: 0.3

price_data:
  start_date: "2015-10-01"

# ── EPS: statutory, from EODHD statements (no estimates) ─────────────────────
# Annual EPS = income-statement NPAT / shares on issue at year end (the repo's
# shared.eodhd.annual_eps method: both share counts checked). Each figure
# applies from its release date: EODHD reportDate, else the ASX two-month
# deadline (late is safe; early would be look-ahead). Half-years are NPAT for
# the six months to December / shares at 31 Dec; the wedge rolls them into a
# trailing-12-month figure at each February result. The Dec and Jun halves sum
# to the reported year exactly (FY23: 16.82 + 17.70 = 34.52).
eps_basis: reported_ttm
earnings:
  - {date: "2016-08-29", period: "FY2016", period_end: "2016-06-30", ttm_eps: 2.790, source: "EODHD income statement", notes: "Statutory NPAT $8.07m / 289.3m shares at year end; EODHD reportDate"}
