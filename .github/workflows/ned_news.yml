name: Ned News Agent

on:
  workflow_dispatch:
    inputs:
      probe_only:
        description: "Only check that every feed / newsletter page responds (no email, no state)"
        required: false
        type: boolean
        default: false
jobs:
  ned:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Singapore

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Ned seen state
        uses: actions/cache/restore@v4
        with:
          path: ned_seen.json
          key: ned-seen-${{ github.ref_name }}
          restore-keys: |
            ned-seen-${{ github.ref_name }}-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ned.txt

      - name: Probe sources
        if: ${{ inputs.probe_only }}
        run: python scripts/ned_probe_sources.py

      - name: Run Ned
        if: ${{ !inputs.probe_only }}
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Half-price Message Batches on automatic runs; a manual run goes direct
          # so you get the answer straight away. Never fewer answers: anything the
          # batch doesn't return within LLM_BATCH_MAX_WAIT_MIN is sent direct.
          LLM_BATCH: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
          LLM_BATCH_MAX_WAIT_MIN: "30"
          NED_SEEN_STATE_PATH: ned_seen.json
          # Optional: Gmail inbox the newsletters arrive at (read-only IMAP).
          # Unset -> falls back to EMAIL_FROM / EMAIL_APP_PASSWORD.
          NED_IMAP_USER: ${{ secrets.NED_IMAP_USER }}
          NED_IMAP_PASSWORD: ${{ secrets.NED_IMAP_PASSWORD }}
        run: |
          python -m ned.main

      - name: Commit dashboard update
        if: ${{ !inputs.probe_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/ned.json
          git diff --staged --quiet || git commit -m "Ned data [skip ci]"
          git pull --rebase origin HEAD
          python scripts/build_dashboard.py
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Dashboard update — Ned [skip ci]"
          git push origin HEAD

      - name: Save Ned seen state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ned_seen.json
          key: ned-seen-${{ github.ref_name }}-${{ github.run_id }}
