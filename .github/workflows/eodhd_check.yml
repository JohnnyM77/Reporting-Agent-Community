name: EODHD Data Check

# On demand: prints every price / PE / EPS / dividend figure the agents will
# use, straight from EODHD, into the run's Summary page so it can be checked
# against a company's own report. Read-only: no email, no commit, no state.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Tickers to check, space separated (blank = whole portfolio). e.g. "PWH BHP RR.L"'
        required: false
        default: ''
      watchlists:
        description: 'Also check every Wally watchlist name'
        type: boolean
        default: false
      detail:
        description: 'Show the EPS working year by year (net income / shares)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Check EODHD figures
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
          TICKERS: ${{ inputs.tickers }}
        run: |
          args=""
          if [ "${{ inputs.watchlists }}" = "true" ]; then args="$args --watchlists"; fi
          if [ "${{ inputs.detail }}" = "true" ]; then args="$args --detail"; fi
          python scripts/eodhd_check.py $TICKERS $args
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eodhd-check
          path: outputs/eodhd_check.md
          if-no-files-found: ignore
