name: Shorty Short Interest

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = build digest + preview but don't send email or update the dashboard commit"
        required: false
        default: "false"
      report_date:
        description: "Optional override: use exactly this date's ASIC report instead of the most recent one (YYYY-MM-DD)"
        required: false
        default: ""
      baseline_date:
        description: "Optional override: use exactly this date's ASIC report as the FY-start baseline (YYYY-MM-DD)"
        required: false
        default: ""
jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests pyyaml playwright

      - name: Install Chromium for Playwright
        # Bundled Chromium is fine here -- the PDF attachment is rendered
        # from our own HTML, not fetched from a fingerprint-gated site
        # (unlike SGX). --with-deps pulls the ubuntu libs it needs.
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Shorty
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.report_date }}" ]; then
            ARGS="$ARGS --report-date ${{ inputs.report_date }}"
          fi
          if [ -n "${{ inputs.baseline_date }}" ]; then
            ARGS="$ARGS --baseline-date ${{ inputs.baseline_date }}"
          fi
          python shorty_agent.py $ARGS

      - name: Upload dry-run preview
        # Dry-run outputs (digest preview + PDF) only ever land in
        # outputs/shorty/ inside the ephemeral runner -- without this
        # they're thrown away when the job ends and a dry run can't
        # actually be inspected.
        if: always() && inputs.dry_run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: shorty-dry-run-preview
          path: outputs/shorty/
          retention-days: 14

      - name: Commit dashboard update
        if: always() && inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/shorty.json
          git diff --staged --quiet || git commit -m "Shorty data [skip ci]"
          git pull --rebase origin HEAD
          python scripts/build_dashboard.py
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Dashboard update -- Shorty [skip ci]"
          git push origin HEAD
